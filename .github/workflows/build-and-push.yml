name: Build and push image

# Builds the Docker image and pushes to GHCR on every push to main, after the
# eval gate (see eval.yml) already passed for that commit. Deployment itself
# (updating the running Azure Container App to the new image) is a manual
# `az containerapp update` step per deploy/azure_deploy.sh — not automated
# here, since that touches live billed resources.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fleetguard:latest
            ghcr.io/${{ github.repository_owner }}/fleetguard:${{ github.sha }}
